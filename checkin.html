<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Check-in</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>

  <header class="header">
    <img src="img/logo.png" class="logo" alt="Quetzal Air">
  </header>

  <main>
    <h1 class="title">Check-in</h1>

    <!-- Formulario -->
    <form class="form">

      <div class="form-group">
        <label for="codigo">Código de reserva</label>
        <input id="codigo" type="text" placeholder="Ej: QZ1234">
      </div>

      <button type="button" class="btn-primary">
        Buscar reserva
      </button>

    </form>
  </main>

</body>
</html>
