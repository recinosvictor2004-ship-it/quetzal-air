<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vuelos Disponibles</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>

  <header class="header">
    <img src="img/logo.png" class="logo" alt="Quetzal Air">
  </header>

  <main>
    <h1 class="title">Vuelos Disponibles</h1>

    <!-- Lista de vuelos -->
    <div class="flights-list">

      <!-- Tarjeta de vuelo -->
      <div class="flight-card">
        <div class="flight-main">
          <span>GUA → LAX</span>
          <span>Q1200</span>
        </div>
        <div class="flight-meta">
          Salida: 10:30 AM — Llegada: 2:15 PM
        </div>
      </div>

      <div class="flight-card">
        <div class="flight-main">
          <span>GUA → MEX</span>
          <span>Q980</span>
        </div>
        <div class="flight-meta">
          Salida: 8:00 AM — Llegada: 10:45 AM
        </div>
      </div>

    </div>
  </main>

</body>
</html>
