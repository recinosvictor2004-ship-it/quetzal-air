<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Confirmar Contraseña</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>

  <header class="header">
    <img src="img/logo.png" class="logo" alt="Quetzal Air">
  </header>

  <main>
    <h1 class="title">Confirmar Contraseña</h1>

    <!-- Formulario -->
    <form class="form">

      <!-- Contraseña -->
      <div class="form-group">
        <label for="pass1">Contraseña</label>
        <input id="pass1" type="password">
      </div>

      <!-- Confirmación -->
      <div class="form-group">
        <label for="pass2">Confirmar contraseña</label>
        <input id="pass2" type="password">
      </div>

      <!-- Botón -->
      <button type="button" class="btn-primary" onclick="location.href='menu.html'">
        Crear cuenta
      </button>

    </form>
  </main>

</body>
</html>
