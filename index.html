<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - Quetzal Air</title>

  <!-- Importamos los CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- ============================
     PANTALLA DE CARGA GLOBAL
     ============================ -->
<div id="loader" class="loader-overlay">
  <div class="loader-circle"></div>
  <p>Cargando...</p>
</div>


  <!-- Encabezado con logo -->
  <header class="header">
    <img src="img/logo.png" class="logo" alt="Quetzal Air">
  </header>

  <main>
    <h1 class="title">Iniciar Sesión</h1>

    <!-- Formulario de login -->
    <form class="form">

      <!-- Campo correo -->
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" placeholder="ejemplo@correo.com">
      </div>

      <!-- Campo contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password">
      </div>

      <!-- Checkbox recordar -->
      <div class="form-inline">
        <input type="checkbox" id="remember">
        <label for="remember">Recordar mis datos</label>
      </div>

      <!-- Botón que simula navegación -->
      <button type="button" class="btn-primary" onclick="location.href='menu.html'">
        Ingresar
      </button>

      <!-- Enlaces secundarios -->
      <div class="form-footer">
        <a href="registro.html">Crear cuenta</a>
        <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
      </div>
    </form>
  </main>

</body>
</html>
